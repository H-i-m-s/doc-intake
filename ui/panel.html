<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文档提取</title>
  <link rel="stylesheet" href="./panel.css" />
</head>
<body>
  <!-- 底色与圆角由宿主的卡片壳提供（manifest 里 cardForm 是 flush），
       这一层只排内容：源 / 保存到 / 开始 / 高级选项 / 结果区，竖着往下走。

       每块都是「标签行 + 控件」两段：标签和它的动作按钮同一行，控件单独一行。
       原因是最上面那块带两个按钮，控件是多行文本，塞进同一行会被挤成一条窄缝；
       三块统一成这个形状，竖着看左边缘是一条线。 -->
  <div class="di-panel" id="di-panel">

    <!-- 第一块：源 -->
    <div class="di-field">
      <div class="di-field__head">
        <span class="di-label">源</span>
        <div class="di-field__actions">
          <button class="di-mini" id="di-pick-file" type="button">选文件</button>
          <button class="di-mini" id="di-pick-dir" type="button">选文件夹</button>
        </div>
      </div>
      <textarea class="di-input di-input--multi" id="di-sources" rows="3"
                placeholder="每行一个文件或文件夹" spellcheck="false" autocomplete="off"></textarea>
    </div>

    <!-- 第二块：保存到。留空不在这里算默认路径 —— 那套规则在解析器一侧，
         面板再算一遍就会出现两种口径。 -->
    <div class="di-field">
      <div class="di-field__head">
        <span class="di-label">保存到</span>
        <div class="di-field__actions">
          <button class="di-mini" id="di-pick-save" type="button">浏览…</button>
        </div>
      </div>
      <input class="di-input" id="di-save-path" type="text"
             placeholder="留空则按设置里的规则由解析器决定" spellcheck="false" autocomplete="off" />
    </div>

    <button class="di-run" id="di-run" type="button">开始提取</button>
    <!-- 提示行：本工单起由 panel.js 填。校验提示、发起失败、打开文件夹失败都落在这里，
         一张面板上只留一处会说话的浅色行，不同时开第二块告示区。 -->
    <p class="di-hint" id="di-run-hint" hidden></p>

    <!-- 第四块：高级选项，默认收起。标题行整行可点，键盘 Enter / 空格也认得，
         所以它是个 button 而不是 div + 监听。
         箭头用 SVG 线条：字符箭头在不同字体里大小与基线都不一样，跟着主题字体变样子。 -->
    <div class="di-adv">
      <button class="di-adv__head" id="di-adv-toggle" type="button"
              aria-expanded="false" aria-controls="di-adv-body">
        <svg class="di-adv__chevron" id="di-adv-chevron" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M4.4 2.6 L7.8 6 L4.4 9.4" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="di-adv__label">高级选项</span>
      </button>
      <div class="di-adv__body" id="di-adv-body" aria-hidden="true">
        <div class="di-adv__inner" id="di-adv-inner">
          <!-- 自绘列表，不用原生 select：原生弹层在 WebView 里跟着系统配色走，
               深色卡片下会变成白底浅字，选项根本读不清。
               列表走普通流布局而不是绝对定位——卡片高度由内容决定，绝对定位会被卡片边界裁掉。 -->
          <div class="di-row di-row--combo">
            <span class="di-row__label" id="di-backend-label">解析后端</span>
            <div class="di-combo" id="di-backend" data-value="auto">
              <button class="di-combo__field" id="di-backend-field" type="button"
                      role="combobox" aria-haspopup="listbox" aria-expanded="false"
                      aria-labelledby="di-backend-label di-backend-value"
                      aria-controls="di-backend-list">
                <span class="di-combo__value" id="di-backend-value">自动</span>
                <svg class="di-combo__chevron" viewBox="0 0 12 12" aria-hidden="true">
                  <path d="M2.6 4.4 L6 7.8 L9.4 4.4" fill="none" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <div class="di-combo__pop" aria-hidden="true">
              <ul class="di-combo__list" id="di-backend-list" role="listbox"
                  aria-labelledby="di-backend-label">
                <li class="di-combo__option" role="option" data-value="auto" aria-selected="true">自动</li>
                <li class="di-combo__option" role="option" data-value="mineru" aria-selected="false">MinerU</li>
                <li class="di-combo__option" role="option" data-value="oxr" aria-selected="false">OXR（SoMark）</li>
                <li class="di-combo__option" role="option" data-value="paddleocr" aria-selected="false">PaddleOCR</li>
                <li class="di-combo__option" role="option" data-value="mineru-local" aria-selected="false">MinerU 本地</li>
                <li class="di-combo__option" role="option" data-value="paddleocr-local" aria-selected="false">PaddleOCR 本地</li>
                <li class="di-combo__option" role="option" data-value="local" aria-selected="false">本地</li>
              </ul>
              </div>
            </div>
          </div>
          <div class="di-row">
            <label class="di-row__label" for="di-page-range">页码范围</label>
            <!-- 页码范围永远从空开始：它是一次调用上的临时参数，不是设置项，
                 没有「上次用的范围」这种东西。 -->
            <input class="di-input" id="di-page-range" type="text"
                   placeholder="如 1-20，留空为全部" spellcheck="false" autocomplete="off" />
          </div>
          <div class="di-row">
            <label class="di-row__label" for="di-language">语言</label>
            <input class="di-input" id="di-language" type="text" spellcheck="false" autocomplete="off" />
          </div>
          <!-- 四个开关排成两行两列：一行四个会被挤到换行，一列四个又把卡片拉长。
               两句用法说明塞在各条的 title 里，不单独占行。 -->
          <div class="di-checks">
            <label class="di-check" title="提取过程中出现的图片、视频、音频一并保存">
              <input type="checkbox" id="di-include-media" />
              <span>提取图片与媒体</span>
            </label>
            <label class="di-check" title="除了 Markdown 之外，同时落一份结构化 JSON">
              <input type="checkbox" id="di-save-json" />
              <span>另存 JSON</span>
            </label>
            <label class="di-check" title="只适用于图片，不会调用任何解析后端">
              <input type="checkbox" id="di-split-only" />
              <span>只做图片分割测试</span>
            </label>
            <label class="di-check" title="会自动落盘，否则连路径都拿不到">
              <input type="checkbox" id="di-summary-only" />
              <span>只返回状态（不返回正文）</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- 结果区：跑起来之后才有。上面是整卡唯一的一条总进度，中间每文件一行，
         最后一行收尾结论。占位一直在 DOM 里，跑之前 hidden。 -->
    <div class="di-result" id="di-result" hidden>
      <div class="di-overall">
        <div class="di-overall__head">
          <span class="di-overall__count" id="di-overall-text"></span>
          <span class="di-overall__percent" id="di-overall-percent">0.0%</span>
        </div>
        <div class="di-bar"><div class="di-bar__fill" id="di-bar-fill"></div></div>
      </div>
      <div class="di-files" id="di-files"></div>
      <p class="di-summary" id="di-summary" hidden></p>
      <!-- 投递区：只在「终态且至少成功一个」时出现。
           按钮是真按钮，靠鼠标点出来；宿主自己采集手势，这里不伪造。
           右边那行先空着，点一次才说话。 -->
      <div class="di-deliver" id="di-deliver" hidden>
        <button class="di-deliver__btn" id="di-deliver-btn" type="button">投递到对话</button>
        <span class="di-deliver__note" id="di-deliver-note" role="status"></span>
      </div>
    </div>
  </div>
  <script type="module" src="./panel.js"></script>
</body>
</html>
