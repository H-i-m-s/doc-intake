<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文档解析进度</title>
  <link rel="stylesheet" href="./card.css" />
</head>
<body>
  <!-- 底色与圆角由宿主的卡片壳提供，这一层只排内容。 -->
  <div class="di-card" id="di-card" data-state="running">
    <div class="di-card__head">
      <span class="di-card__title" id="di-title">文档解析</span>
      <span class="di-card__meta">
        <span class="di-card__elapsed" id="di-elapsed">已等待 0 秒</span>
        <span class="di-card__state" id="di-state">解析中</span>
      </span>
    </div>
    <div class="di-card__bar">
      <div class="di-card__bar-fill" id="di-fill"></div>
    </div>
    <div class="di-card__files" id="di-files"></div>
  </div>
  <script type="module" src="./card.js"></script>
</body>
</html>
